<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購物車結算 - TSSC13TH</title>
  <link rel="stylesheet" href="style.css">
  <!-- 引入 Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- 頂部導覽列 (統一排版) -->
  <header>
    <div class="nav-brand">
      <img src="tpshcmcsc.png" alt="TSSC13TH 標誌" onerror="this.src='tpshcmcsc.png'">
      <span>TSSC13TH 公投與周邊專區</span>
    </div>
    <nav class="nav-links">
      <a href="index.html">首頁與通知</a>
      <a href="cart.html" class="active">🛒 購物車結算</a>
      <a href="query.html">📋 查詢我的訂單</a>
      <a href="admin.html">⚙️ 管理員後台</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h2>🛒 您的預購購物車結算</h2>
      
      <!-- 購物車商品列表區 -->
      <div id="cartItemsContainer">載入中...</div>
      
      <!-- 結算表單區塊 (當購物車有商品時顯示) -->
      <div id="checkoutFormContainer" style="display:none; margin-top: 24px; border-top: 2px solid #e5e7eb; padding-top: 20px;">
        <h3>📝 填寫結算與實名驗證資料</h3>
        
        <!-- 🔐 Google 身分驗證區塊 -->
        <div id="authBox" style="margin-bottom: 20px; padding: 16px; background: #f3f4f6; border-radius: 8px; border: 1px solid #e5e7eb;">
          <div id="notLoggedIn" style="text-align: center;">
            <p style="margin-bottom: 12px; font-weight: bold; color: #374151;">🔒 結算前請先透過學校官方帳號進行實名認證：</p>
            <div id="g_id_onload" 
                 data-client_id="434067788519-6s6r01fhhtn2d5200hmu2aqsh9v6dtoh.apps.googleusercontent.com" 
                 data-callback="handleCredentialResponse" 
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
            <small style="display:block; margin-top:8px; color:#6b7280;">⚠️ 必須使用學校官方信箱（@tshcmc.edu.vn）登入始可結算。</small>
          </div>

          <div id="isLoggedIn" style="display:none; justify-content:space-between; align-items:center;">
            <div>
              <small style="color: #6b7280;">已驗證學校身分信箱：</small><br>
              <strong id="verifiedEmailDisplay" style="color: #166534; font-size: 1.05rem;"></strong>
            </div>
            <button type="button" onclick="logout()" style="padding: 6px 12px; background: #ef4444; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">切換帳號</button>
          </div>
        </div>

        <form onsubmit="submitCheckout(event)">
          <div class="form-group">
            <label for="studentName">真實姓名 / 班級座號：</label>
            <input type="text" id="studentName" required placeholder="例如：Nguyen Van A (12A1)">
          </div>

          <button type="submit" id="submitBtn" class="submit-btn" disabled style="background:#9ca3af; cursor:not-allowed;">🚀 請先完成 Google 登入後始可送出</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx7o4EJKoFsiJojM3FfS0pqj8n77mrdDR318Srn7DRy0kkFjMvogprtnHD0loSKqcB0/exec";
    let authenticatedEmail = "";

    window.onload = function() {
      renderCart();
      let savedEmail = localStorage.getItem('tss_logged_email');
      if (savedEmail) {
        setAuthenticatedEmail(savedEmail);
      }
    };

    // 格式化越盾金額
    function formatVND(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount) + ' ₫';
    }

    // Google OAuth 驗證回呼
    function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);
      const email = responsePayload.email;

      const studentRegex = /^\d{7}@tshcmc\.edu\.vn$/;
      const isAdmin = (email === "yucheng.server@gmail.com");

      if (!studentRegex.test(email) && !isAdmin) {
        alert('【身分拒絕】本系統僅限使用學校官方信箱（@tshcmc.edu.vn）登入與結算！');
        return;
      }

      localStorage.setItem('tss_logged_email', email);
      setAuthenticatedEmail(email);
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function setAuthenticatedEmail(email) {
      authenticatedEmail = email;
      document.getElementById('notLoggedIn').style.display = 'none';
      document.getElementById('isLoggedIn').style.display = 'flex';
      document.getElementById('verifiedEmailDisplay').innerText = email;

      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.style.background = "#2563eb";
      btn.style.cursor = "pointer";
      btn.innerText = "🚀 確認送出所有購物車訂單";
    }

    function logout() {
      localStorage.removeItem('tss_logged_email');
      authenticatedEmail = "";
      document.getElementById('notLoggedIn').style.display = 'block';
      document.getElementById('isLoggedIn').style.display = 'none';

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.style.background = "#9ca3af";
      btn.style.cursor = "not-allowed";
      btn.innerText = "🚀 請先完成 Google 登入後始可送出";
    }

    // 渲染購物車內容 (支援即時修改數量與切換規格選項)
    function renderCart() {
      let cart = JSON.parse(localStorage.getItem('tss_cart') || '[]');
      const container = document.getElementById('cartItemsContainer');
      const checkoutBox = document.getElementById('checkoutFormContainer');

      if (cart.length === 0) {
        container.innerHTML = `<div class="empty-state">購物車目前是空的，快去首頁選購吧！</div>`;
        checkoutBox.style.display = 'none';
        return;
      }

      checkoutBox.style.display = 'block';
      let grandTotal = 0;

      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 12px;">
          ${cart.map((item, index) => {
            let itemTotal = Number(item.price) * item.quantity;
            grandTotal += itemTotal;

            // 處理規格選項下拉選單
            let optionSelectorHtml = '';
            if (item.options && item.options.trim() !== "") {
              let optArray = item.options.split(',').map(o => o.trim());
              optionSelectorHtml = `
                <div style="margin-top: 4px;">
                  <small style="color:#4b5563;">規格：</small>
                  <select onchange="updateItemOption(${index}, this.value)" style="padding: 2px 6px; font-size: 0.8rem; border-radius: 4px; border: 1px solid #d1d5db;">
                    ${optArray.map(opt => `<option value="${opt}" ${opt === (item.selected_option || '預設') ? 'selected' : ''}>${opt}</option>`).join('')}
                  </select>
                </div>
              `;
            } else {
              optionSelectorHtml = `<small style="color:#059669; font-weight:bold;">規格：${item.selected_option || '預設'}</small>`;
            }

            return `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:#f9fafb; border:1px solid #e5e7eb; border-radius:8px; gap:12px; flex-wrap:wrap;">
                <div style="display:flex; align-items:center; gap:12px; flex:1; min-width:200px;">
                  <img src="${item.img1 || 'tpshcmcsc.png'}" alt="圖" style="width:50px; height:50px; object-fit:cover; border-radius:6px;">
                  <div>
                    <strong>${item.title}</strong><br>
                    <small style="color:#6b7280;">單價：${formatVND(item.price)}</small>
                    ${optionSelectorHtml}
                  </div>
                </div>
                
                <div style="display:flex; align-items:center; gap:16px;">
                  <div>
                    <label style="font-size:0.8rem; color:#6b7280; display:block;">數量：</label>
                    <input type="number" min="1" value="${item.quantity}" onchange="updateItemQuantity(${index}, this.value)" style="width:60px; padding:4px; border:1px solid #d1d5db; border-radius:4px; text-align:center;">
                  </div>
                  <div style="text-align:right; min-width:90px;">
                    <span style="font-weight:bold; color:#0284c7; display:block;">${formatVND(itemTotal)}</span>
                  </div>
                  <button type="button" onclick="removeItem(${index})" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.85rem;">移除</button>
                </div>
              </div>
            `;
          }).join('')}
          <div style="text-align:right; font-size:1.2rem; font-weight:bold; margin-top:12px; color:#111827;">
            總金額合計：<span style="color:#0284c7;">${formatVND(grandTotal)}</span>
          </div>
        </div>
      `;
    }

    // 即時更新購物車中某項商品的數量
    function updateItemQuantity(index, val) {
      let cart = JSON.parse(localStorage.getItem('tss_cart') || '[]');
      let qty = parseInt(val);
      if (isNaN(qty) || qty < 1) {
        alert('購買數量至少須為 1 件！');
        renderCart();
        return;
      }
      cart[index].quantity = qty;
      localStorage.setItem('tss_cart', JSON.stringify(cart));
      renderCart();
    }

    // 即時更新購物車中某項商品的規格選項
    function updateItemOption(index, val) {
      let cart = JSON.parse(localStorage.getItem('tss_cart') || '[]');
      cart[index].selected_option = val;
      localStorage.setItem('tss_cart', JSON.stringify(cart));
      renderCart();
    }

    // 移除單一商品
    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('tss_cart') || '[]');
      cart.splice(index, 1);
      localStorage.setItem('tss_cart', JSON.stringify(cart));
      renderCart();
    }

    // 提交結算 (包含數量與所選規格)
    async function submitCheckout(e) {
      e.preventDefault();
      
      if (!authenticatedEmail) {
        alert('請先完成 Google 帳號登入！');
        return;
      }

      const name = document.getElementById('studentName').value.trim();
      let cart = JSON.parse(localStorage.getItem('tss_cart') || '[]');

      if (cart.length === 0) {
        alert('購物車是空的！');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "正在送出訂單...";

      try {
        // 迴圈將購物車每一項商品透過 submitOrder 送至後端 (攜帶最新數量與規格)
        for (let item of cart) {
          await fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "submitOrder",
              productId: item.product_id,
              email: authenticatedEmail,
              name: name,
              quantity: item.quantity,
              selected_option: item.selected_option || '預設',
              remark: "購物車批次結算"
            })
          });
        }

        alert('🎉 恭喜！您的所有預購訂單已成功送出！');
        localStorage.removeItem('tss_cart'); // 清空購物車
        location.href = "query.html"; // 引導至查詢頁面
      } catch (err) {
        alert('送出訂單發生網路錯誤，請稍後再試。');
        btn.disabled = false;
        btn.innerText = "🚀 確認送出所有購物車訂單";
      }
    }
  </script>
</body>
</html>
