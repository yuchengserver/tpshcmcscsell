<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品預購與填單 - TSSC13TH</title>
  <link rel="stylesheet" href="style.css">
  <!-- 引入 Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* 單品預購頁面專屬電商化風格微調 */
    .product-summary {
      display: flex;
      gap: 16px;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
    }
    .product-summary img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
    }
    .product-info h3 {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
      color: #1f2937;
    }
    .product-info p {
      margin: 0 0 8px 0;
      font-size: 0.85rem;
      color: #6b7280;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      overflow: hidden;
    }
    .product-info .price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #dc2626; /* 蝦皮紅 */
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 (統一設計排版) -->
  <header>
    <div class="nav-brand">
      <img src="tpshcmcsc.png" alt="TSSC13TH 標誌" onerror="this.src='tpshcmcsc.png'">
      <span>TSSC13TH 公投與周邊專區</span>
    </div>
    <nav class="nav-links">
      <a href="index.html">首頁與通知</a>
      <a href="cart.html">🛒 購物車結算</a>
      <a href="query.html">📋 查詢我的訂單</a>
      <a href="admin.html">⚙️ 管理員後台</a>
    </nav>
  </header>

  <div class="container">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
      <h2 style="margin-bottom: 10px; color: #111827;">📝 單品預購與快速下單填寫</h2>
      
      <!-- 動態載入所選商品資訊 -->
      <div id="selectedProductContainer" class="product-summary">
        <img id="previewImg" src="tpshcmcsc.png" alt="商品圖片" onerror="this.onerror=null; this.src='tpshcmcsc.png';">
        <div class="product-info" style="flex:1;">
          <h3 id="previewTitle">載入中或未選擇特定商品...</h3>
          <p id="previewDesc">請從首頁瀏覽商品，或在此確認您選購的單品資訊。</p>
          <div id="previewPrice" class="price">-- ₫</div>
        </div>
      </div>

      <!-- 🔐 Google 身分驗證區塊 -->
      <div id="authBox" style="margin-top: 24px; padding: 16px; background: #f3f4f6; border-radius: 8px; border: 1px solid #e5e7eb;">
        <div id="notLoggedIn" style="text-align: center;">
          <p style="margin-bottom: 12px; font-weight: bold; color: #374151;">🔒 下單前請先透過學校官方帳號進行實名認證：</p>
          <div id="g_id_onload" 
               data-client_id="434067788519-6s6r01fhhtn2d5200hmu2aqsh9v6dtoh.apps.googleusercontent.com" 
               data-callback="handleCredentialResponse" 
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
          <small style="display:block; margin-top:8px; color:#6b7280;">⚠️ 必須使用 7 位數字學號之 @tshcmc.edu.vn 信箱登入。</small>
        </div>

        <div id="isLoggedIn" style="display:none; justify-content:space-between; align-items:center;">
          <div>
            <small style="color: #6b7280;">已驗證學校身分信箱：</small><br>
            <strong id="verifiedEmailDisplay" style="color: #166534; font-size: 1.05rem;"></strong>
          </div>
          <button type="button" onclick="logout()" style="padding: 6px 12px; background: #ef4444; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">切換帳號</button>
        </div>
      </div>

      <form id="orderForm" onsubmit="submitOrder(event)" style="margin-top: 24px;">
        <!-- 隱藏的商品 ID 與 已驗證信箱 -->
        <input type="hidden" id="productId" name="productId">

        <!-- 動態規格選項容器 -->
        <div id="productOptionsContainer"></div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label for="studentName" style="display: block; font-weight: bold; margin-bottom: 6px; color: #374151;">真實姓名 / 班級座號：</label>
          <input type="text" id="studentName" required placeholder="例如：Nguyen Van A (12A1)" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem;">
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label for="quantity" style="display: block; font-weight: bold; margin-bottom: 6px; color: #374151;">購買數量：</label>
          <input type="number" id="quantity" min="1" value="1" required onchange="calculateTotal()" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem;">
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px; color: #374151;">總金額試算 (越盾 VND)：</label>
          <div id="totalPriceDisplay" style="font-size: 1.25rem; font-weight: bold; color: #dc2626; padding: 6px 0;">0 ₫</div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label for="remark" style="display: block; font-weight: bold; margin-bottom: 6px; color: #374151;">備註說明 (選填)：</label>
          <textarea id="remark" rows="2" placeholder="其他特殊需求或備註..." style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem;"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn" disabled style="background:#9ca3af; cursor:not-allowed; width: 100%; padding: 12px; border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 1rem;">🚀 請先完成 Google 登入後始可送出</button>
      </form>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx7o4EJKoFsiJojM3FfS0pqj8n77mrdDR318Srn7DRy0kkFjMvogprtnHD0loSKqcB0/exec";
    let currentProductPrice = 0;
    let authenticatedEmail = "";

    window.onload = async function() {
      // 1. 載入商品資訊
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('id');

      if (prodId) {
        document.getElementById('productId').value = prodId;
        await loadProductDetails(prodId);
      } else {
        document.getElementById('previewTitle').innerText = "未指定特定商品";
        document.getElementById('previewDesc').innerText = "建議您直接至首頁瀏覽商品或使用購物車結算。";
      }

      // 2. 檢查舊登入狀態
      let savedEmail = localStorage.getItem('tss_logged_email');
      if (savedEmail) {
        setAuthenticatedEmail(savedEmail);
      }
    };

    // Google OAuth 驗證邏輯
    function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);
      const email = responsePayload.email;

      const studentRegex = /^\d{7}@tshcmc\.edu\.vn$/;
      const isAdmin = (email === "yucheng.server@gmail.com");

      if (!studentRegex.test(email) && !isAdmin) {
        alert('【身分拒絕】本系統僅限使用學校官方信箱（@tshcmc.edu.vn）登入與下單！');
        return;
      }

      localStorage.setItem('tss_logged_email', email);
      setAuthenticatedEmail(email);
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function setAuthenticatedEmail(email) {
      authenticatedEmail = email;
      document.getElementById('notLoggedIn').style.display = 'none';
      document.getElementById('isLoggedIn').style.display = 'flex';
      document.getElementById('verifiedEmailDisplay').innerText = email;

      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.style.background = "#2563eb";
      btn.style.cursor = "pointer";
      btn.innerText = "🚀 確認送出預購訂單";
    }

    function logout() {
      localStorage.removeItem('tss_logged_email');
      authenticatedEmail = "";
      document.getElementById('notLoggedIn').style.display = 'block';
      document.getElementById('isLoggedIn').style.display = 'none';

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.style.background = "#9ca3af";
      btn.style.cursor = "not-allowed";
      btn.innerText = "🚀 請先完成 Google 登入後始可送出";
    }

    function formatVND(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount) + ' ₫';
    }

    // 解析選項 (相容 JSON 或逗號分隔)
    function parseOptions(optionsStr) {
      if (!optionsStr || optionsStr.trim() === "") return [];
      try {
        let parsed = JSON.parse(optionsStr);
        if (typeof parsed === 'object') {
          let firstKey = Object.keys(parsed)[0];
          return parsed[firstKey] || [];
        }
      } catch(e) {
        return optionsStr.split(',').map(o => o.trim()).filter(o => o);
      }
      return [];
    }

    async function loadProductDetails(prodId) {
      try {
        const response = await fetch(`${GAS_API_URL}?action=getProducts`);
        const result = await response.json();
        if (result.status === "success") {
          const product = result.data.find(p => p.product_id === prodId);
          if (product) {
            document.getElementById('previewTitle').innerText = product.title;
            document.getElementById('previewDesc').innerText = product.description || '';
            document.getElementById('previewImg').src = product.img1 || 'tpshcmcsc.png';
            currentProductPrice = Number(product.price);
            document.getElementById('previewPrice').innerText = formatVND(currentProductPrice);
            
            // 動態產生規格選項下拉選單
            const optContainer = document.getElementById('productOptionsContainer');
            let optArray = parseOptions(product.options);
            
            if (optArray.length > 0) {
              optContainer.innerHTML = `
                <div class="form-group" style="margin-bottom: 16px;">
                  <label for="productOption" style="display: block; font-weight: bold; margin-bottom: 6px; color: #374151;">選擇規格 / 選項：</label>
                  <select id="productOption" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; background: #fff;">
                    ${optArray.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                  </select>
                </div>
              `;
            } else {
              optContainer.innerHTML = `<input type="hidden" id="productOption" value="預設">`;
            }

            calculateTotal();
          }
        }
      } catch (e) {
        console.error("載入商品資訊失敗", e);
      }
    }

    function calculateTotal() {
      const qty = document.getElementById('quantity').value || 1;
      const total = currentProductPrice * qty;
      document.getElementById('totalPriceDisplay').innerText = formatVND(total);
    }

    async function submitOrder(e) {
      e.preventDefault();
      const productId = document.getElementById('productId').value;
      const optionInput = document.getElementById('productOption');
      const selectedOption = optionInput ? optionInput.value : '預設';

      if (!productId) {
        alert('尚未選擇任何商品，請返回首頁重新選擇！');
        return;
      }
      
      if (!authenticatedEmail) {
        alert('請先點擊上方按鈕完成 Google 帳號登入！');
        return;
      }

      const orderData = {
        action: "submitOrder",
        productId: productId,
        email: authenticatedEmail,
        name: document.getElementById('studentName').value,
        quantity: document.getElementById('quantity').value,
        selected_option: selectedOption,
        remark: document.getElementById('remark').value
      };

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "提交中...";

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify(orderData)
        });
        const result = await response.json();
        alert(result.message);
        if(result.status === "success") {
          location.href = "query.html";
        }
      } catch (err) {
        alert("提交發生錯誤，請檢查網路連線。");
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 確認送出預購訂單";
      }
    }
  </script>
</body>
</html>
