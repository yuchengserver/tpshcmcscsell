<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品預購與填單 - TSSC13TH</title>
  <link rel="stylesheet" href="style.css">
  <!-- 引入 Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* 單品預購頁面專屬電商化風格微調 */
    .product-summary {
      display: flex;
      gap: 16px;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
    }
    .product-summary img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
    }
    .product-info h3 {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
      color: #1f2937;
    }
    .product-info p {
      margin: 0 0 8px 0;
      font-size: 0.85rem;
      color: #6b7280;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      overflow: hidden;
    }
    .product-info .price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #dc2626; /* 蝦皮紅 */
    }
    .stock-badge {
      display: inline-block;
      background: #f3f4f6;
      color: #374151;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 6px;
      font-weight: 600;
    }

    /* 三欄式排版：姓名、班級、座號 */
    .form-row-three {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 640px) {
      .form-row-three {
        grid-template-columns: 1fr;
      }
    }

    /* 🔐 右上角導覽列登入精緻化 CSS 樣式 */
    .nav-auth-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .nav-user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .nav-user-email {
      color: #166534;
      font-weight: bold;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-nav-logout {
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-nav-logout:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }
  </style>
  <script>
  // ⚡ 全域防閃爍引擎：在 DOM 載入前瞬間完成驗證與樣式套用
  (function() {
    const savedEmail = sessionStorage.getItem('tss_logged_email');
    const loginTime = sessionStorage.getItem('tss_login_time');
    
    // 檢查是否有登入紀錄且在 30 分鐘有效時間內
    if (savedEmail && loginTime && (Date.now() - Number(loginTime) <= 30 * 60 * 1000)) {
      // 若已登入，直接注入 CSS 強制預先隱藏未登入按鈕、顯示已登入態，零延遲不閃爍
      document.write(`
        <style>
          #navNotLoggedIn { display: none !important; }
          #navIsLoggedIn { display: flex !important; }
        </style>
      `);
    }
  })();
</script>
</head>
<body>

  <!-- 頂部導覽列 (統一排版，登入移至右上角) -->
  <header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 12px 24px;">
    <div class="nav-brand">
      <a href="index.html" class="nav-brand">
      <img src="tpshcmcsc.png" alt="TSSC Logo" class="nav-logo">
      <span>TSSC13TH 周邊購物專區</span>
    </div>
    
    <nav class="nav-links" style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
      <a href="index.html">首頁與通知</a>
      <a href="cart.html">🛒 購物車結算</a>
      <a href="query.html">📋 查詢我的訂單</a>
      <a href="admin.html">⚙️ 管理員後台</a>

      <!-- 🔐 右上角導覽列 Google 登入狀態 -->
      <div class="nav-auth-container">
        <div id="navNotLoggedIn">
          <div id="g_id_onload" 
               data-client_id="434067788519-6s6r01fhhtn2d5200hmu2aqsh9v6dtoh.apps.googleusercontent.com" 
               data-callback="handleCredentialResponse" 
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin" data-type="compact" data-size="medium" data-theme="outline"></div>
        </div>

        <div id="navIsLoggedIn" class="nav-user-info" style="display: none;">
          <span style="color: #64748b;">已登入:</span>
          <span id="navUserEmail" class="nav-user-email"></span>
          <button type="button" class="btn-nav-logout" onclick="logout()">登出</button>
        </div>
      </div>
    </nav>
  </header>

  <div class="container">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
      <h2 style="margin-bottom: 10px; color: #111827;">📝 單品預購與快速下單填寫</h2>
      
      <!-- 動態載入所選商品資訊 -->
      <div id="selectedProductContainer" class="product-summary">
        <img id="previewImg" src="tpshcmcsc.png" alt="商品圖片" onerror="this.onerror=null; this.src='tpshcmcsc.png';">
        <div class="product-info" style="flex:1;">
          <h3 id="previewTitle">載入中或未選擇特定商品...</h3>
          <p id="previewDesc">請從首頁瀏覽商品，或在此確認您選購的單品資訊。</p>
          <div id="previewPrice" class="price">-- ₫</div>
          <div id="previewStock" class="stock-badge">庫存載入中...</div>
        </div>
      </div>

      <form id="orderForm" onsubmit="submitOrder(event)" style="margin-top: 24px;">
        <!-- 隱藏的商品 ID 與庫存 -->
        <input type="hidden" id="productId" name="productId">
        <input type="hidden" id="productStock" name="productStock" value="0">

        <!-- 動態規格選項容器 -->
        <div id="productOptionsContainer"></div>

        <!-- 👤 拆解為三格：真實姓名、班級、座號 -->
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; font-weight: bold; margin-bottom: 6px; color: #374151;">訂購者身分資料 (姓名 / 班級 / 座號) *：</label>
          <div class="form-row-three">
            <input type="text" id="inputName" required placeholder="真實姓名 (例: Nguyen Van A)" style="padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem;">
            <input type="text" id="inputClass" required placeholder="班級 (例: 12A1)" style="padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem;">
            <input type="text" id="inputSeat" required placeholder="座號 (例: 15)" style="padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem;">
          </div>
          <small style="color: #6b7280; margin-top: 4px; display: block;">系統將自動組合成格式存入後台對帳清單中。</small>
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label for="quantity" style="display: block; font-weight: bold; margin-bottom: 6px; color: #374151;">購買數量：</label>
          <input type="number" id="quantity" min="1" value="1" required onchange="calculateTotal()" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem;">
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px; color: #374151;">總金額試算 (越盾 VND)：</label>
          <div id="totalPriceDisplay" style="font-size: 1.25rem; font-weight: bold; color: #dc2626; padding: 6px 0;">0 ₫</div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label for="remark" style="display: block; font-weight: bold; margin-bottom: 6px; color: #374151;">備註說明 (選填)：</label>
          <textarea id="remark" rows="2" placeholder="其他特殊需求或備註..." style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem;"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn" disabled style="background:#9ca3af; cursor:not-allowed; width: 100%; padding: 12px; border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 1rem;">🚀 請先完成右上角 Google 登入後始可送出</button>
      </form>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx7o4EJKoFsiJojM3FfS0pqj8n77mrdDR318Srn7DRy0kkFjMvogprtnHD0loSKqcB0/exec";
    let currentProductPrice = 0;
    let authenticatedEmail = "";

    window.onload = async function() {
      checkSessionTimeout();

      // 1. 載入商品資訊
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('id');

      if (prodId) {
        document.getElementById('productId').value = prodId;
        await loadProductDetails(prodId);
      } else {
        document.getElementById('previewTitle').innerText = "未指定特定商品";
        document.getElementById('previewDesc').innerText = "建議您直接至首頁瀏覽商品或使用購物車結算。";
        document.getElementById('previewStock').style.display = 'none';
      }
    };

    // ⏱️ 檢查登入是否逾時（30分鐘過期或關閉分頁自動登出）
    function checkSessionTimeout() {
      const loginTime = sessionStorage.getItem('tss_login_time');
      const savedEmail = sessionStorage.getItem('tss_logged_email');
      const now = Date.now();
      const TIMEOUT_LIMIT = 30 * 60 * 1000; // 30 分鐘

      if (!savedEmail || !loginTime || (now - Number(loginTime) > TIMEOUT_LIMIT)) {
        logout(true);
      } else {
        setNavLoggedIn(savedEmail);
      }
    }

    // Google OAuth 驗證邏輯
    function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);
      const email = responsePayload.email;

      const studentRegex = /^\d{7}@tshcmc\.edu\.vn$/;
      const isAdmin = (email === "yucheng.server@gmail.com");

      if (!studentRegex.test(email) && !isAdmin) {
        alert('【身分拒絕】本系統僅限使用學校官方信箱（@tshcmc.edu.vn）登入與下單！');
        return;
      }

      sessionStorage.setItem('tss_logged_email', email);
      sessionStorage.setItem('tss_login_time', Date.now());
      setNavLoggedIn(email);
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function setNavLoggedIn(email) {
      authenticatedEmail = email;
      document.getElementById('navNotLoggedIn').style.display = 'none';
      document.getElementById('navIsLoggedIn').style.display = 'flex';
      document.getElementById('navUserEmail').innerText = email;

      const btn = document.getElementById('submitBtn');
      if (btn) {
        btn.disabled = false;
        btn.style.background = "#000000"; // 黑底白字
        btn.style.cursor = "pointer";
        btn.innerText = "🚀 確認送出預購訂單";
      }
    }

    function logout(isSilent = false) {
      sessionStorage.removeItem('tss_logged_email');
      sessionStorage.removeItem('tss_login_time');
      authenticatedEmail = "";
      
      document.getElementById('navNotLoggedIn').style.display = 'block';
      document.getElementById('navIsLoggedIn').style.display = 'none';
      document.getElementById('navUserEmail').innerText = "";

      const btn = document.getElementById('submitBtn');
      if (btn) {
        btn.disabled = true;
        btn.style.background = "#9ca3af";
        btn.style.cursor = "not-allowed";
        btn.innerText = "🚀 請先完成右上角 Google 登入後始可送出";
      }

      if (!isSilent) {
        alert("已成功登出帳號！");
      }
    }

    function formatVND(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount) + ' ₫';
    }

    function parseOptions(optionsStr) {
      if (!optionsStr || optionsStr.trim() === "") return [];
      try {
        let parsed = JSON.parse(optionsStr);
        if (typeof parsed === 'object') {
          let firstKey = Object.keys(parsed)[0];
          return parsed[firstKey] || [];
        }
      } catch(e) {
        return optionsStr.split(',').map(o => o.trim()).filter(o => o);
      }
      return [];
    }

    async function loadProductDetails(prodId) {
      try {
        const response = await fetch(`${GAS_API_URL}?action=getProducts`);
        const result = await response.json();
        if (result.status === "success") {
          const product = result.data.find(p => p.product_id === prodId);
          if (product) {
            document.getElementById('previewTitle').innerText = product.title;
            document.getElementById('previewDesc').innerText = product.description || '';
            document.getElementById('previewImg').src = product.img1 || 'tpshcmcsc.png';
            currentProductPrice = Number(product.price);
            document.getElementById('previewPrice').innerText = formatVND(currentProductPrice);
            
            // 記錄當前商品庫存到隱藏欄位
            const stock = parseInt(product.stock) || 0;
            document.getElementById('productStock').value = stock;
            const stockBadge = document.getElementById('previewStock');
            if (stock > 0) {
              stockBadge.innerText = `目前剩餘庫存：${stock} 件`;
              stockBadge.style.background = "#dcfce7";
              stockBadge.style.color = "#166534";
            } else {
              stockBadge.innerText = `⚠️ 目前已售完 (送出將自動轉為候補登記)`;
              stockBadge.style.background = "#fee2e2";
              stockBadge.style.color = "#991b1b";
            }
            
            const optContainer = document.getElementById('productOptionsContainer');
            let optArray = parseOptions(product.options);
            
            if (optArray.length > 0) {
              optContainer.innerHTML = `
                <div class="form-group" style="margin-bottom: 16px;">
                  <label for="productOption" style="display: block; font-weight: bold; margin-bottom: 6px; color: #374151;">選擇規格 / 選項：</label>
                  <select id="productOption" required style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; background: #fff;">
                    ${optArray.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                  </select>
                </div>
              `;
            } else {
              optContainer.innerHTML = `<input type="hidden" id="productOption" value="預設">`;
            }

            calculateTotal();
          }
        }
      } catch (e) {
        console.error("載入商品資訊失敗", e);
      }
    }

    function calculateTotal() {
      const qty = document.getElementById('quantity').value || 1;
      const total = currentProductPrice * qty;
      document.getElementById('totalPriceDisplay').innerText = formatVND(total);
    }

    async function submitOrder(e) {
      e.preventDefault();
      const productId = document.getElementById('productId').value;
      const optionInput = document.getElementById('productOption');
      const selectedOption = optionInput ? optionInput.value : '預設';

      // 🌟 獨立抓取真實姓名、班級與座號
      const nameVal = document.getElementById('inputName').value.trim();
      const classVal = document.getElementById('inputClass').value.trim();
      const seatVal = document.getElementById('inputSeat').value.trim();

      if (!nameVal || !classVal || !seatVal) {
        alert('請完整填寫真實姓名、班級與座號！');
        return;
      }

      const quantity = parseInt(document.getElementById('quantity').value) || 1;
      const stock = parseInt(document.getElementById('productStock').value) || 0;

      // 📦 檢查庫存：若數量大於庫存或庫存為 0，提示並自動轉為候補
      let orderStatus = "待付款";
      if (stock <= 0 || quantity > stock) {
        const confirmWaitlist = confirm(`【庫存提示】目前此商品庫存僅剩 ${stock} 件（您欲購買 ${quantity} 件）。是否同意自動轉為「候補中」進行登記排隊？`);
        if (!confirmWaitlist) {
          return;
        }
        orderStatus = "候補中";
      }

      if (!productId) {
        alert('尚未選擇任何商品，請返回首頁重新選擇！');
        return;
      }
      
      if (!authenticatedEmail) {
        alert('請先完成右上角 Google 帳號登入！');
        return;
      }

      // 🌟 嚴格對應後端所需的獨立欄位名稱 (className, seatNo, name)
      const orderData = {
        action: "submitOrder",
        productId: productId,
        email: authenticatedEmail,
        className: classVal,   // 對應後端 data.className
        seatNo: seatVal,       // 對應後端 data.seatNo
        name: nameVal,         // 對應後端 data.name
        quantity: quantity,
        selected_option: selectedOption,
        remark: document.getElementById('remark').value,
        status: orderStatus    // 傳遞狀態（待付款或候補中）
      };

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "提交中...";

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify(orderData)
        });
        const result = await response.json();
        alert(result.message);
        if(result.status === "success") {
          location.href = "query.html";
        }
      } catch (err) {
        alert("提交發生錯誤，請檢查網路連線。");
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 確認送出預購訂單";
      }
    }
  </script>
  <!-- 📌 全站底部版權宣告 -->
  <footer style="text-align: center; padding: 24px; margin-top: 40px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 0.85rem; background: #f9fafb;">
    胡志明市臺灣學校學生會 TSSC13TH © 2026 yucheng
  </footer>
</body>
</html>
