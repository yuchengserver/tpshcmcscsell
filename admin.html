<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSS13TH 周邊商城 - 智慧管理員後台</title>
  <link rel="stylesheet" href="style.css">
  <!-- 引入 Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: #f3f4f6; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; color: #4b5563; }
    .tab-btn.active { background: #000000; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #ffffff; padding: 20px; border-radius: 10px; border: 1px solid #e5e7eb; text-align: center; }
    .stat-card .num { font-size: 1.6rem; font-weight: bold; color: #0284c7; margin-top: 6px; }
    .form-item-card { background: #fdfdfd; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
    .nav-auth-container { display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 6px 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .nav-user-email { color: #166534; font-weight: bold; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-nav-logout { background: #ef4444; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
  </style>
</head>
<body>

  <header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 12px 24px;">
    <div class="nav-brand">
      <img src="tpshcmcsc.png" alt="標誌" style="filter: brightness(0) saturate(100%);">
      <span>TSSC13TH 智慧管理員後台</span>
    </div>
    
    <nav class="nav-links">
      <a href="index.html">首頁與通知</a>
      <a href="cart.html">🛒 購物車結算</a>
      <a href="query.html">📋 查詢訂單</a>
      <a href="admin.html" class="active">⚙️ 後台</a>

      <!-- 🔐 右上角 Google 登入狀態 -->
      <div class="nav-auth-container">
        <div id="navNotLoggedIn">
          <div id="g_id_onload" data-client_id="434067788519-6s6r01fhhtn2d5200hmu2aqsh9v6dtoh.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
          <div class="g_id_signin" data-type="compact" data-size="medium" data-theme="outline"></div>
        </div>
        <div id="navIsLoggedIn" class="nav-user-info" style="display: none;">
          <span style="color: #64748b;">已登入:</span>
          <span id="navUserEmail" class="nav-user-email"></span>
          <button type="button" class="btn-nav-logout" onclick="logout()">登出</button>
        </div>
      </div>
    </nav>
  </header>

  <div class="container">
    <div class="dashboard-grid">
      <div class="stat-card"><div class="label">總預購數</div><div id="statTotalOrders" class="num">0 筆</div></div>
      <div class="stat-card"><div class="label">預計總營收 (VND)</div><div id="statTotalRevenue" class="num" style="color:#16a34a;">0 ₫</div></div>
      <div class="stat-card"><div class="label">待付款數</div><div id="statPendingOrders" class="num" style="color:#d97706;">0 筆</div></div>
    </div>

    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchTab(event, 'tabOrders')">📊 訂單總覽</button>
      <button class="tab-btn" onclick="switchTab(event, 'tabReconcile')">🧮 AI 智慧對帳中心</button>
      <button class="tab-btn" onclick="switchTab(event, 'tabProductAdd')">🛍️ 上架商品</button>
      <button class="tab-btn" onclick="switchTab(event, 'tabProductManage')">📋 庫存管理</button>
      <button class="tab-btn" onclick="switchTab(event, 'tabPrintPreview')">🖨️ 列印與 Canva 匯出</button>
    </div>

    <!-- 標籤頁 1：訂單總覽 -->
    <div id="tabOrders" class="tab-content active">
      <div class="admin-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2>📋 訂單總覽與狀態管理</h2>
          <button onclick="exportOrdersToCSV()" class="btn-export">📥 匯出 CSV</button>
        </div>
        <div style="overflow-x: auto;">
          <table class="product-table">
            <thead>
              <tr><th>編號</th><th>訂購者資訊</th><th>商品與規格</th><th>數量 / 金額</th><th>時間</th><th>狀態變更</th></tr>
            </thead>
            <tbody id="adminOrderTableBody"><tr><td colspan="6" style="text-align:center;">載入中...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 標籤頁 2：AI 對帳中心 -->
    <div id="tabReconcile" class="tab-content">
      <div class="admin-card">
        <h2>🧮 班級自動對帳與自動核銷中心</h2>
        <p style="color:#6b7280; font-size:0.9rem;">選擇班級輸入點鈔金額，若金額完全正確將自動把消費者訂單改為「已付款」。</p>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:16px;">
          <div>
            <label style="font-weight:bold;">選擇班級：</label>
            <select id="reconcileClassSelect" onchange="updateReconcileExpected()" style="width:100%; padding:8px; border:1px solid #d1d5db; border-radius:6px;"></select>
          </div>
          <div>
            <label style="font-weight:bold;">系統預期總金額：</label>
            <div id="expectedTotalDisplay" style="font-weight:bold; color:#0284c7; font-size:1.2rem; margin-top:6px;">0 ₫</div>
          </div>
        </div>

        <div class="form-group">
          <label style="font-weight:bold;">實際收到總金額 (VND)：</label>
          <input type="number" id="actualReceivedAmount" style="width:100%; padding:8px; border:1px solid #d1d5db; border-radius:6px; font-weight:bold; font-size:1.05rem;">
        </div>

        <button type="button" onclick="executeReconciliation()" class="btn-reconcile">🚀 開始自動對帳與核銷</button>
        <div id="reconcileResultArea" style="margin-top:24px;"></div>
      </div>
    </div>

    <!-- 標籤頁 3：上架新商品 (選項標題與按鈕左右並排) -->
    <div id="tabProductAdd" class="tab-content">
      <div class="admin-card">
        <form id="productForm" onsubmit="handleProductSubmit(event)">
          <div class="form-grid">
            <div class="form-group"><label>商品名稱 *：</label><input type="text" id="prodTitle" required></div>
            <div class="form-group"><label>價格 (VND) *：</label><input type="number" id="prodPrice" required></div>
            <div class="form-group"><label>限量庫存數量 *：</label><input type="number" id="prodStock" min="1" required></div>
            <div class="form-group">
              <label>上架狀態：</label>
              <select id="prodStatus"><option value="開放中">開放中</option><option value="預告中">預告中</option><option value="已完售">已完售</option></select>
            </div>
          </div>

          <!-- ⚙️ 左右並排：左側標題、右側新增按鈕 -->
          <div style="margin-top:20px;">
            <div class="options-header-row">
              <strong style="color:#111827; font-size:1rem;">⚙️ 商品規格與選項設定</strong>
              <button type="button" onclick="addOptionCard()" class="btn-black">＋ 新增規格選項組</button>
            </div>
            <div id="optionsCardsContainer"></div>
          </div>

          <div class="form-group" style="margin-top:16px;"><label>詳細說明：</label><textarea id="prodDesc" rows="2"></textarea></div>
          <button type="submit" class="btn-black" style="width:100%; padding:12px; margin-top:10px;">🚀 立即上架</button>
        </form>
      </div>
    </div>

    <!-- 標籤頁 4：庫存管理 -->
    <div id="tabProductManage" class="tab-content">
      <div class="admin-card">
        <h2>📋 現有上架商品控管</h2>
        <table class="product-table">
          <thead><tr><th>ID</th><th>名稱</th><th>價格</th><th>庫存</th><th>狀態調整</th></tr></thead>
          <tbody id="adminProductTableBody"><tr><td colspan="5" style="text-align:center;">載入中...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- 標籤頁 5：列印與 Canva 匯出 -->
    <div id="tabPrintPreview" class="tab-content">
      <div class="admin-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h2>🖨️ 繳費單與 Canva 格式匯出</h2>
          <div style="display:flex; gap:10px;">
            <select id="previewClassSelect" onchange="renderPrintPreview()" style="padding:6px; border:1px solid #d1d5db; border-radius:4px;"></select>
            <button onclick="openPrintPreviewModal()" class="btn-print">🖨️ 預覽與轉 PDF</button>
          </div>
        </div>
        <div id="printPreviewContainer" class="card" style="margin-top:15px;"><div style="text-align:center; color:#6b7280;">請選擇班級...</div></div>
      </div>
    </div>
  </div>

  <!-- 🖨️ 預覽彈窗 (支援一鍵複製貼到 Canva 與繳費勾選格) -->
  <div id="printModalOverlay">
    <div id="printModalContent">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e5e7eb; padding-bottom:10px; margin-bottom:15px;">
        <h3 style="margin:0;">📄 繳費清單預覽 (含繳費勾選格)</h3>
        <button onclick="closePrintModal()" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">關閉</button>
      </div>
      <div id="printableArea" style="flex:1; overflow-y:auto; padding:20px; background:#fff; border:1px solid #e5e7eb;"></div>
      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px; border-top:1px solid #e5e7eb; padding-top:15px;">
        <button onclick="copyTableForCanva()" class="btn-black" style="background:#7c3aed;">🎨 複製表格資料以貼至 Canva</button>
        <button onclick="window.print()" class="btn-print">🖨️ 直接列印 PDF</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx7o4EJKoFsiJojM3FfS0pqj8n77mrdDR318Srn7DRy0kkFjMvogprtnHD0loSKqcB0/exec";
    let globalOrdersData = [];
    let globalProductsData = [];

    function formatVND(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount) + ' ₫';
    }

    window.onload = function() {
      checkSessionTimeout();
      loadAdminProducts();
      loadAllOrders();
      addOptionCard();
    };

    function checkSessionTimeout() {
      const loginTime = sessionStorage.getItem('tss_login_time');
      const savedEmail = sessionStorage.getItem('tss_logged_email');
      if (!savedEmail || !loginTime || (Date.now() - Number(loginTime) > 30 * 60 * 1000)) {
        logout(true);
      } else {
        setNavLoggedIn(savedEmail);
      }
    }

    function handleCredentialResponse(response) {
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      const email = payload.email;
      if (!/^\d{7}@tshcmc\.edu\.vn$/.test(email) && email !== "yucheng.server@gmail.com") {
        alert('【身分拒絕】僅限學校官方信箱登入後台！');
        return;
      }
      sessionStorage.setItem('tss_logged_email', email);
      sessionStorage.setItem('tss_login_time', Date.now());
      setNavLoggedIn(email);
      loadAllOrders();
    }

    function setNavLoggedIn(email) {
      document.getElementById('navNotLoggedIn').style.display = 'none';
      document.getElementById('navIsLoggedIn').style.display = 'flex';
      document.getElementById('navUserEmail').innerText = email;
    }

    function logout(isSilent = false) {
      sessionStorage.removeItem('tss_logged_email');
      sessionStorage.removeItem('tss_login_time');
      document.getElementById('navNotLoggedIn').style.display = 'block';
      document.getElementById('navIsLoggedIn').style.display = 'none';
      if (!isSilent) alert("已登出！");
    }

    function switchTab(evt, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
      if (tabId === 'tabPrintPreview') initPrintPreviewDropdown();
      if (tabId === 'tabReconcile') initReconcileDropdown();
    }

    function addOptionCard() {
      const container = document.getElementById('optionsCardsContainer');
      const cardId = 'opt-' + Date.now();
      const div = document.createElement('div');
      div.className = 'form-item-card';
      div.id = cardId;
      div.innerHTML = `
        <div style="display:flex; justify-content:between; margin-bottom:8px;">
          <strong style="font-size:0.9rem;">規格組</strong>
          <button type="button" onclick="document.getElementById('${cardId}').remove()" style="background:#fee2e2; color:#dc2626; border:none; padding:2px 8px; border-radius:4px; cursor:pointer;">刪除</button>
        </div>
        <div style="display:grid; grid-template-columns:1fr 2fr; gap:10px;">
          <input type="text" class="opt-name-input" placeholder="選項名稱 (如尺寸)">
          <input type="text" class="opt-val-input" placeholder="選項值逗號隔開 (S, M, L)">
        </div>`;
      container.appendChild(div);
    }

    function buildOptionsJson() {
      let obj = {};
      document.querySelectorAll('.form-item-card').forEach(card => {
        let k = card.querySelector('.opt-name-input').value.trim();
        let v = card.querySelector('.opt-val-input').value.trim();
        if (k && v) obj[k] = v.split(',').map(x => x.trim());
      });
      return JSON.stringify(obj);
    }

    async function loadAdminProducts() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getProducts`);
        const result = await res.json();
        if (result.status === "success") {
          globalProductsData = result.data;
          document.getElementById('adminProductTableBody').innerHTML = globalProductsData.map(p => `
            <tr>
              <td>${p.product_id}</td>
              <td><strong>${p.title}</strong></td>
              <td>${formatVND(p.price)}</td>
              <td><input type="number" value="${p.stock}" style="width:70px;" onchange="updateStock('${p.product_id}', this.value)"></td>
              <td><select onchange="updateStatus('${p.product_id}', this.value)"><option value="開放中" ${p.status==='開放中'?'selected':''}>開放中</option><option value="已完售" ${p.status==='已完售'?'selected':''}>已完售</option></select></td>
            </tr>`).join('');
        }
      } catch(e) {}
    }

    async function loadAllOrders() {
      const email = sessionStorage.getItem('tss_logged_email') || "";
      try {
        const res = await fetch(`${GAS_API_URL}?action=getAllOrders&email=${encodeURIComponent(email)}`);
        const result = await res.json();
        if (result.status === "success") {
          globalOrdersData = result.data;
          let rev = 0, pending = 0;
          globalOrdersData.forEach(o => {
            if (o.status !== '已取消') rev += Number(o.total_price || 0);
            if (o.status === '待付款' || o.status === '候補中') pending++;
          });
          document.getElementById('statTotalOrders').innerText = globalOrdersData.length + " 筆";
          document.getElementById('statTotalRevenue').innerText = formatVND(rev);
          document.getElementById('statPendingOrders').innerText = pending + " 筆";
          renderOrdersTable(globalOrdersData);
        }
      } catch(e) {}
    }

    function renderOrdersTable(orders) {
      document.getElementById('adminOrderTableBody').innerHTML = orders.map(o => `
        <tr>
          <td><small>${o.order_id}</small></td>
          <td><strong>${o.name}</strong><br><small>${o.email}</small></td>
          <td>${o.product_title} (${o.selected_option || '預設'})</td>
          <td>${o.quantity}件 / <strong>${formatVND(o.total_price)}</strong></td>
          <td><small>${o.timestamp}</small></td>
          <td><select onchange="changeStatus('${o.order_id}', this.value)">
            <option value="待付款" ${o.status==='待付款'?'selected':''}>待付款</option>
            <option value="已付款" ${o.status==='已付款'?'selected':''}>已付款</option>
            <option value="已取消" ${o.status==='已取消'?'selected':''}>已取消</option>
          </select></td>
        </tr>`).join('');
    }

    function initReconcileDropdown() {
      let groups = {};
      globalOrdersData.forEach(o => {
        let m = o.name.match(/\(([^)]+)\)/);
        let c = m ? m[1].trim().toUpperCase() : "未分類";
        if (!groups[c]) groups[c] = [];
        groups[c].push(o);
      });
      document.getElementById('reconcileClassSelect').innerHTML = Object.keys(groups).map(c => `<option value="${c}">${c}</option>`).join('');
      updateReconcileExpected();
    }

    function updateReconcileExpected() {
      let c = document.getElementById('reconcileClassSelect').value;
      let orders = globalOrdersData.filter(o => o.name.toUpperCase().includes(c));
      let expected = orders.reduce((sum, o) => sum + Number(o.total_price || 0), 0);
      document.getElementById('expectedTotalDisplay').innerText = formatVND(expected);
      document.getElementById('actualReceivedAmount').value = expected;
    }

    // 🚀 金額完全正確時自動改為已付款
    async function executeReconciliation() {
      let c = document.getElementById('reconcileClassSelect').value;
      let actual = Number(document.getElementById('actualReceivedAmount').value);
      let orders = globalOrdersData.filter(o => o.name.toUpperCase().includes(c));
      let expected = orders.reduce((sum, o) => sum + Number(o.total_price || 0), 0);
      let diff = actual - expected;
      let resArea = document.getElementById('reconcileResultArea');
      const email = sessionStorage.getItem('tss_logged_email') || "";

      if (diff === 0) {
        // 自動將該班級消費者訂單改為已付款
        try {
          for (let o of orders) {
            if (o.status !== '已付款') {
              await fetch(GAS_API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "updateOrderStatus", email: email, orderId: o.order_id, newStatus: "已付款" })
              });
            }
          }
          resArea.innerHTML = `<div style="padding:15px; background:#f0fdf4; color:#166534; border-radius:6px; font-weight:bold;">✅ 金額完美吻合 (${formatVND(expected)})！系統已自動將該班所有消費者的訂單狀態更新為「已付款」。</div>`;
          loadAllOrders();
        } catch(e) { alert("自動更新失敗"); }
      } else {
        resArea.innerHTML = `<div style="padding:15px; background:#fef2f2; color:#991b1b; border-radius:6px; font-weight:bold;">⚠️ 金額有誤！差額：${formatVND(diff)}。可能是數錯金額或其他原因，請人工排查。</div>`;
      }
    }

    function initPrintPreviewDropdown() {
      let groups = {};
      globalOrdersData.forEach(o => {
        let m = o.name.match(/\(([^)]+)\)/);
        let c = m ? m[1].trim().toUpperCase() : "未分類";
        if (!groups[c]) groups[c] = [];
        groups[c].push(o);
      });
      document.getElementById('previewClassSelect').innerHTML = Object.keys(groups).map(c => `<option value="${c}">${c}</option>`).join('');
      renderPrintPreview();
    }

    // 🖨️ 產生含繳費勾選格的報表
    function renderPrintPreview() {
      let c = document.getElementById('previewClassSelect').value;
      let orders = globalOrdersData.filter(o => o.name.toUpperCase().includes(c));
      let total = orders.reduce((sum, o) => sum + Number(o.total_price), 0);

      document.getElementById('printPreviewContainer').innerHTML = `
        <h3 style="border-bottom:2px solid #000; padding-bottom:6px;">TSSC13TH 繳費清單 - ${c}</h3>
        <table class="product-table">
          <thead><tr><th>序號</th><th>姓名</th><th>學號信箱</th><th>品項與規格</th><th>金額</th><th>繳費確認 (□)</th></tr></thead>
          <tbody>
            ${orders.map((o, i) => `
              <tr>
                <td>${i+1}</td>
                <td><strong>${o.name}</strong></td>
                <td><small>${o.email}</small></td>
                <td>${o.product_title} (${o.selected_option || '預設'})</td>
                <td><strong>${Number(o.total_price).toLocaleString()} ₫</strong></td>
                <td style="text-align:center; font-size:1.2rem;">□</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <div style="margin-top:15px; text-align:right; font-weight:bold;">總計：${total.toLocaleString()} ₫</div>`;
    }

    function openPrintPreviewModal() {
      document.getElementById('printableArea').innerHTML = document.getElementById('printPreviewContainer').innerHTML;
      document.getElementById('printModalOverlay').style.display = 'flex';
    }

    function closePrintModal() {
      document.getElementById('printModalOverlay').style.display = 'none';
    }

    function copyTableForCanva() {
      const text = document.getElementById('printableArea').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('📋 表格文字已複製！您可以直接至 Canva 建立文件並按 Ctrl+V 貼上使用。');
      });
    }

    async function handleProductSubmit(e) {
      e.preventDefault();
      const email = sessionStorage.getItem('tss_logged_email') || "";
      const data = {
        action: "addProduct", email,
        title: document.getElementById('prodTitle').value,
        price: document.getElementById('prodPrice').value,
        stock: document.getElementById('prodStock').value,
        status: document.getElementById('prodStatus').value,
        options: buildOptionsJson(),
        description: document.getElementById('prodDesc').value
      };
      const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(data) });
      const result = await res.json();
      alert(result.message);
      if(result.status === "success") { loadAdminProducts(); document.getElementById('productForm').reset(); }
    }

    async function changeOrderStatus(orderId, newStatus) {
      const email = sessionStorage.getItem('tss_logged_email') || "";
      await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "updateOrderStatus", email, orderId, newStatus }) });
      loadAllOrders();
    }
  </script>
</body>
