<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSS13TH 周邊商城 - 管理員後台</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 這裡覆蓋 style.css 中的通用樣式，將後台改成黑色主題 */
    
    /* 1. 將頂部導覽列改成黑色背景，文字與會徽改成白色 */
    header {
      background: #1a1a1a !important; /* 黑色背景 */
      border-bottom: 1px solid #333 !important;
    }
    .nav-brand span {
      color: #ffffff !important; /* 白色文字 */
    }
    .nav-links a {
      color: #aaaaaa !important; /* 深灰色文字 */
    }
    .nav-links a.active, .nav-links a:hover {
      background-color: #333333 !important;
      color: #ffffff !important;
    }
    
    /* 2. 移除原會徽圖片，使用 CSS 建立黑色實心圓會徽 */
    .nav-brand img {
      display: none; /* 隱藏原圖 */
    }
    .nav-brand::before {
      content: '';
      display: block;
      height: 32px;
      width: 32px;
      background-color: #ffffff; /* 黑色主題下的白色圓 */
      border-radius: 50%;
      margin-right: 12px;
    }

    /* 3. 將主要卡片與表單背景改成深灰色，文字改成白色 */
    body {
      background-color: #121212; /* 更深的黑色背景 */
      color: #eeeeee;
    }
    .admin-card {
      background: #1a1a1a !important; /* 深灰色卡片 */
      border: 1px solid #333 !important;
      color: #eeeeee;
    }
    .admin-card h2 {
      color: #ffffff;
      border-bottom: 2px solid #333;
    }
    .form-group label {
      color: #aaaaaa;
    }
    .form-group input, .form-group select, .form-group textarea {
      background-color: #262626; /* 輸入框背景 */
      border: 1px solid #333;
      color: #ffffff;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #ffffff; /* 聚焦時白色邊框 */
    }

    /* 4. 將確認送出按鈕改成純黑色與白色文字 */
    .action-btn {
      background-color: #000000 !important; /* 純黑色按鈕 */
      color: #ffffff !important; /* 白色文字 */
    }
    .action-btn:hover {
      background-color: #262626 !important; /* 滑過時變成深灰 */
    }

    /* 5. 表格與空白狀態樣式調整 */
    .product-table th {
      background-color: #262626;
      color: #ffffff;
      border: 1px solid #333;
    }
    .product-table td {
      border: 1px solid #333;
    }
    .empty-state {
      background: #1a1a1a;
      border: 1px dashed #333;
      color: #aaaaaa;
    }
    
    /* 6. 錯誤與成功提示樣式 */
    .error-notice {
      background-color: #450a0a;
      color: #fecaca;
      border: 1px solid #7f1d1d;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none; /* 預設隱藏 */
    }
    .success-notice {
      background-color: #052e16;
      color: #b91c1c;
      border: 1px solid #166534;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="nav-brand">
      <!-- 圖片已隱藏，由 CSS ::before 產生黑色會徽 -->
      <img src="tpshcmcsc.png" alt="TSS 標誌">
      <span>TSS13TH 周邊商城後台</span>
    </div>
    <nav class="nav-links">
      <a href="index.html">首頁與通知</a>
      <a href="buy.html">查詢我的訂單</a>
      <a href="admin.html" class="active">管理員後台</a>
    </nav>
  </header>

  <div class="container">

    <!-- 成功與錯誤提示區塊 (用於處理連線問題提示) -->
    <div id="successNotice" class="success-notice">✅ 商品上架成功！</div>
    <div id="errorNotice" class="error-notice">❌ 載入失敗或連線逾時。請檢查網路、GAS API 網址，或確認 GAS 專案已重新部署並「公開存取」。</div>

    <!-- 商品上架表單區塊 -->
    <div class="admin-card">
      <h2>🛍️ 新增與上架周邊商品</h2>
      
      <form id="productForm" onsubmit="handleProductSubmit(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="prodTitle">商品名稱：</label>
            <input type="text" id="prodTitle" required placeholder="例如：TSS 13th 紀念帽T">
          </div>

          <div class="form-group">
            <label for="prodPrice">價格 (越盾 VND)：</label>
            <input type="number" id="prodPrice" min="0" step="500" required placeholder="例如：150000">
            <small>單位：₫ (VND)</small>
          </div>

          <div class="form-group">
            <label for="prodStock">限量 / 庫存數量：</label>
            <input type="number" id="prodStock" min="1" required placeholder="例如：50">
          </div>

          <div class="form-group">
            <label for="prodStatus">上架狀態：</label>
            <select id="prodStatus">
              <option value="開放中">目前開放中</option>
              <option value="預告中">即將開始 / 預告中</option>
              <option value="已完售">已完售</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>商品圖片連結 (最多 3 張)：</label>
          <input type="url" id="img1" placeholder="主圖 URL (必填 - 建議填入圖片網址)" required style="margin-bottom: 8px;">
          <input type="url" id="img2" placeholder="副圖 1 URL (選填)" style="margin-bottom: 8px;">
          <input type="url" id="img3" placeholder="副圖 2 URL (選填)">
        </div>

        <div class="form-group full-width">
          <label for="prodDesc">商品簡介與規格說明：</label>
          <textarea id="prodDesc" rows="3" placeholder="請輸入材質、尺寸對照或詳細說明..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="action-btn">🚀 確認上架商品</button>
      </form>
    </div>

    <!-- 現有商品清單與管理區塊 -->
    <div class="admin-card">
      <h2>📋 現有商城商品清單</h2>
      <div style="overflow-x: auto;">
        <table class="product-table">
          <thead>
            <tr>
              <th>主圖</th>
              <th>商品名稱</th>
              <th>價格 (VND)</th>
              <th>庫存</th>
              <th>狀態</th>
            </tr>
          </thead>
          <tbody id="adminProductTableBody">
            <tr>
              <td colspan="5" style="text-align: center; color: #aaaaaa;">載入中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // ⚠️ 請替換成您部署 GAS 後端取得的網頁應用程式網址 (Web App URL)
    const GAS_API_URL = "YOUR_GAS_WEB_APP_URL_HERE";

    // 格式化越盾金額 (越盾計價)
    function formatVND(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount) + ' ₫';
    }

    // 頁面載入時抓取現有商品
    window.onload = function() {
      loadAdminProducts();
    };

    // 抓取並渲染後台商品列表 (強化錯誤處理)
    async function loadAdminProducts() {
      const tbody = document.getElementById('adminProductTableBody');
      const errorNotice = document.getElementById('errorNotice');
      
      errorNotice.style.display = 'none'; // 先隱藏錯誤提示

      try {
        // 設定 8 秒連線逾時，避免畫面卡死
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        
        const response = await fetch(`${GAS_API_URL}?action=getProducts`, { signal: controller.signal });
        clearTimeout(timeoutId);
        
        const result = await response.json();
        
        if (result.status === "success" && result.data.length > 0) {
          tbody.innerHTML = result.data.map(p => `
            <tr>
              <td><img src="${p.img1 || 'tpshcmcsc.png'}" alt="商品圖" onerror="this.onerror=null; this.src='tpshcmcsc.png';"></td>
              <td><strong>${p.title}</strong><br><small style="color:#aaaaaa;">${p.product_id}</small></td>
              <td style="color:#ffffff; font-weight:bold;">${formatVND(p.price)}</td>
              <td>${p.stock}</td>
              <td><span style="padding:2px 8px; border-radius:4px; font-size:0.8rem; background:${p.status === '開放中' ? '#052e16; color:#a3e635;' : '#262626; color:#aaaaaa;'}">${p.status}</span></td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="5" class="empty-state">目前尚無任何上架商品。</td></tr>`;
        }
      } catch (error) {
        console.error("載入失敗", error);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444;">❌ 無法連線至後端載入資料。</td></tr>`;
        
        // 顯示連線失敗提示區塊
        errorNotice.style.display = 'block';
        errorNotice.innerText = `❌ 無法連線至後端。可能原因：網路問題、GAS URL 錯誤、或 GAS 未重新部署為「公開存取」。`;
      }
    }

    // 提交商品上架 (黑色按鈕、強化錯誤處理)
    async function handleProductSubmit(e) {
      e.preventDefault();
      
      const errorNotice = document.getElementById('errorNotice');
      const successNotice = document.getElementById('successNotice');
      
      errorNotice.style.display = 'none';
      successNotice.style.display = 'none';

      const productData = {
        action: "addProduct",
        title: document.getElementById('prodTitle').value,
        price: document.getElementById('prodPrice').value,
        stock: document.getElementById('prodStock').value,
        status: document.getElementById('prodStatus').value,
        img1: document.getElementById('img1').value,
        img2: document.getElementById('img2').value,
        img3: document.getElementById('img3').value,
        description: document.getElementById('prodDesc').value
      };

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "上架中...";

      try {
        // 設定 10 秒提交逾時
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify(productData),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        
        const result = await response.json();
        
        if (result.status === "success") {
          successNotice.style.display = 'block';
          successNotice.innerText = `✅ 商品上架成功！ID: ${result.productId}`;
          document.getElementById('productForm').reset();
          loadAdminProducts(); // 重新整理列表
        } else {
          errorNotice.style.display = 'block';
          errorNotice.innerText = `❌ 上架失敗：${result.message}`;
        }
      } catch (err) {
        console.error("提交錯誤", err);
        errorNotice.style.display = 'block';
        errorNotice.innerText = `❌ 連線錯誤或逾時。請檢查 GAS 網址與專案部署狀態。`;
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 確認上架商品";
      }
    }
  </script>
</body>
</html>
